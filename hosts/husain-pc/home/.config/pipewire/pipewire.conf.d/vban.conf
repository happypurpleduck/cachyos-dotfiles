# VBAN receiver — Windows (VoiceMeeter) audio played on this machine.
#
# Uses PipeWire's built-in libpipewire-module-vban-recv instead of the
# vban_receptor daemon this machine used before. That daemon needed an AUR
# build (vban-git, which pulls in JACK), a user service, and a 30 s watchdog
# timer that restarted it whenever its PulseAudio stream died. The module does
# the receiving in-process, so none of those are needed.
#
# VoiceMeeter side: VBAN -> OUTGOING -> stream name "WindowsAudio",
# destination this machine's LAN address, port 6980.
context.modules = [
    { name = libpipewire-module-vban-recv
        args = {
            # This machine's LAN address (a DHCP reservation, so it is stable).
            # Kept for intent and for multicast. Note that PipeWire 1.6 forces
            # INADDR_ANY for unicast anyway, so the port is still reachable on
            # every interface — the match rule below is what filters senders.
            source.ip = "192.168.1.110"
            source.port = 6980

            # LAN latency target (the module default is 100 ms, meant for the
            # internet). 20 ms is safe on wired; drop toward 5-10 ms if the
            # Windows box is wired and you want it tighter.
            sess.latency.msec = 20

            # Only the VoiceMeeter stream we expect becomes a node; other VBAN
            # senders on the network are ignored. Add vban.ip = "<windows ip>"
            # to this match to also pin it to a single sender.
            stream.rules = [
                { matches = [ { sess.name = "WindowsAudio" } ]
                  actions = { create-stream = { } }
                }
            ]

            # No audio.format / audio.rate / audio.channels on purpose: since
            # PipeWire 1.2 the module reads them from each VBAN header, so the
            # stream always matches whatever VoiceMeeter is sending.
            #
            # The default stream class is playback, so WirePlumber links it to
            # the current default output like any app — same result as the old
            # vban_receptor. Change it to "Audio/Source" to expose it as a
            # virtual microphone (e.g. to record Windows audio in OBS) instead.
            stream.props = {
                media.class = "Stream/Output/Audio"
                node.name = "vban-windows"
                node.description = "VoiceMeeter (VBAN)"
            }
        }
    }
]
