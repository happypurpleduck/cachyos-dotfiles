# husain-parcel is hybrid: GTX 1650 SUPER + Intel UHD 630, with Hyprland
# compositing on the NVIDIA card. Left to choose, Hokum's wgpu picks the Intel
# Vulkan driver, and Hyprland can't import those buffers, so every notification
# card and the settings window show up as solid black boxes. Only offer it the
# NVIDIA driver.
[Service]
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/nvidia_icd.json
