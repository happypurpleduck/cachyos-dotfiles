[Settings]
language = en
folder = ~/Pictures/Wallpapers/catppuccin-mocha
monitors = All
wallpaper =
backend = awww
fill = fill
sort = name
color = #1e1e2e
subfolders = False
show_hidden = False
show_gifs_only = False
post_command = ~/.config/quickshell/scripts/mocha-theme set --no-wallpaper "$wallpaper"
number_of_columns = 3
awww_transition_type = grow
awww_transition_step = 90
awww_transition_angle = 0
awww_transition_duration = 1.5
awww_transition_fps = 144
