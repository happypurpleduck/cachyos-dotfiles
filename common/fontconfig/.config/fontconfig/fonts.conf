<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  System fonts
    sans-serif : Inter          (Latin)  + IBM Plex Sans Arabic (Arabic)
    monospace  : JetBrains Mono (Latin)  + IBM Plex Sans Arabic (Arabic)
  Neither Inter nor JetBrains Mono has Arabic glyphs, so Arabic text falls back
  to the font listed second instead of DejaVu Sans.
-->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>IBM Plex Sans Arabic</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Inter</family>
      <family>IBM Plex Sans Arabic</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>IBM Plex Sans Arabic</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>ui-monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>IBM Plex Sans Arabic</family>
    </prefer>
  </alias>

  <!-- Apps that ask for a font by name (Inter, JetBrains Mono, Discord's/Chrome's
       own fonts) still get Plex for Arabic glyphs -->
  <alias binding="weak">
    <family>Inter</family>
    <default><family>IBM Plex Sans Arabic</family></default>
  </alias>
  <alias binding="weak">
    <family>JetBrainsMono Nerd Font</family>
    <default><family>IBM Plex Sans Arabic</family></default>
  </alias>

  <!-- Text tagged as Arabic picks Plex first -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>IBM Plex Sans Arabic</string></edit>
  </match>
</fontconfig>
