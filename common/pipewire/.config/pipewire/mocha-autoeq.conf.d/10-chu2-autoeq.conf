# Moondrop Chu 2 (CDSP) — AutoEq parametric EQ, done inside PipeWire (builtin biquads,
# no EasyEffects, no extra latency). It's a WirePlumber "smart filter": it attaches
# itself whenever audio goes to the CDSP and stays out of the way for other outputs.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Chu 2 AutoEq"
            media.name       = "Chu 2 AutoEq"
            filter.graph = {
                nodes = [
                    {   type   = builtin
                        name   = eq
                        label  = param_eq
                        # param_eq fopen()s this as-is (no ~ or $HOME expansion), so
                        # it is relative to the service's WorkingDirectory=%h.
                        config = { filename = ".config/pipewire/autoeq/moondrop-chu-2.txt" }
                    }
                ]
                inputs  = [ "eq:In 1" "eq:In 2" ]
                outputs = [ "eq:Out 1" "eq:Out 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.chu2_autoeq"
                media.class = Audio/Sink
                filter.smart        = true
                filter.smart.name   = "chu2-autoeq"
                filter.smart.target = { node.name = "alsa_output.usb-KTMicro_CDSP_2020-02-20-0000-0000-0000-00.analog-stereo" }
            }
            playback.props = {
                node.name    = "effect_output.chu2_autoeq"
                node.passive = true
                stream.dont-remix = true
            }
        }
    }
]
