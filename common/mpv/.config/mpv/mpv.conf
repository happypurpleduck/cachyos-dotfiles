# mpv — tuned for anime on an RTX 4070 Ti (1440p @ 144 Hz)
# UI: uosc (+ thumbfast seek thumbnails), Catppuccin Mocha with the shell's accent.
# Anime4K upscaling: Ctrl+1…6, Ctrl+0 to turn off (see input.conf).

# ── Video ────────────────────────────────────────────────────────────
profile=high-quality
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe                 # NVDEC; falls back to software when unsafe
video-sync=display-resample     # smooth playback matched to 144 Hz
interpolation=no                # no frame blending: keeps line art crisp
tscale=oversample

# scalers: sharp for upscaling line art, soft for downscaling
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# debanding: anime gradients band badly in 8-bit encodes
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=5

dither-depth=auto

# ── Audio / subtitle languages ───────────────────────────────────────
alang=jpn,ja,jp,japanese,eng,en
slang=eng,en,enUS,en-US,english
audio-file-auto=fuzzy
sub-auto=fuzzy
sub-file-paths=subs:Subs:subtitles:Subtitles
volume=100
volume-max=150
audio-channels=auto

# Fansub (ASS) subtitles keep their own styling; plain SRT gets this look
sub-ass-override=scale
blend-subtitles=no
sub-font="Inter"
sub-bold=yes
sub-font-size=44
sub-color="#cdd6f4"
sub-border-color="#11111b"
sub-border-size=2.6
sub-shadow-offset=1
sub-shadow-color="#11111b99"
sub-margin-y=40
sub-fix-timing=yes

# ── Window / behaviour ───────────────────────────────────────────────
osc=no                          # uosc replaces the built-in controller
osd-bar=no
border=no
keep-open=yes
save-position-on-quit=yes
watch-later-options-remove=sid,aid,glsl-shaders
autofit-larger=85%x85%
cursor-autohide=1000
force-window=immediate

osd-font="Inter"
osd-font-size=30
osd-color="#cdd6f4"
osd-border-color="#11111b"
osd-border-size=2

# ── Screenshots ──────────────────────────────────────────────────────
screenshot-dir=~/Pictures/Screenshots/mpv
screenshot-format=png
screenshot-png-compression=7
screenshot-template="%F_%P"
screenshot-tag-colorspace=yes

# ── Streaming (yt-dlp) ───────────────────────────────────────────────
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB

# ── Profiles ─────────────────────────────────────────────────────────
[low-res-anime]
# SD / 720p sources: slightly stronger debanding
profile-cond=height and height <= 720
profile-restore=copy
deband-iterations=3
deband-threshold=45
