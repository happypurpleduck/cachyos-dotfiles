# mpv keys. Lines with `#!` also appear in uosc's right-click menu.

# ── Anime4K (upscaling for anime; heavier modes need a strong GPU) ──
#   A: most sources (1080p/720p)  B: blurry/soft sources  C: noisy/low-quality sources
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A"   #! Anime4K > Mode A (most sources)
CTRL+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode B"   #! Anime4K > Mode B (blurry sources)
CTRL+3 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode C"   #! Anime4K > Mode C (noisy sources)
CTRL+4 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A+A"   #! Anime4K > Mode A+A (strongest)
CTRL+5 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode B+B"   #! Anime4K > Mode B+B
CTRL+6 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode C+A"   #! Anime4K > Mode C+A
CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "Anime4K: off"   #! Anime4K > Off

# ── Everyday ─────────────────────────────────────────────────────────
MBTN_RIGHT script-binding uosc/menu
MENU       script-binding uosc/menu
s          script-binding uosc/subtitles                  #! Subtitles
a          script-binding uosc/audio                      #! Audio tracks
CTRL+s     async screenshot                               #! Screenshot
S          async screenshot video
ENTER      script-binding uosc/playlist                   #! Playlist
c          script-binding uosc/chapters                   #! Chapters
>          script-binding uosc/next                       #! Next
<          script-binding uosc/prev                       #! Previous
i          script-binding stats/display-stats-toggle      #! Stats
o          script-binding uosc/open-file                  #! Open file
d          cycle deband                                   #! Toggle debanding
z          add sub-delay -0.1
Z          add sub-delay +0.1
WHEEL_UP   add volume 2
WHEEL_DOWN add volume -2
RIGHT      seek  5
LEFT       seek -5
UP         seek  60
DOWN       seek -60
q          quit-watch-later
